<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Stream Player - Reproductor IPTV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo-section">
                    <i class="bi bi-tv-fill logo-icon"></i>
                    <h1 class="app-title">TV Stream Player</h1>
                </div>
                <div class="proxy-toggle-section">
                    <span class="proxy-label">Proxy</span>
                    <button id="proxyToggle" class="proxy-toggle-btn" title="Activar/Desactivar Proxy">
                        <i class="bi bi-shield-slash-fill proxy-icon-off"></i>
                        <i class="bi bi-shield-check-fill proxy-icon-on"></i>
                    </button>
                    <span id="proxyStatus" class="proxy-status status-off">OFF</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <div class="row d-flex justify-content-center h-100">
                <!-- Playlist Sidebar -->
                <div class="col-md-3 d-none" id="playlist">
                    <div class="playlist-container">
                        <div class="search-container">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" id="searchInput" class="form-control search-bar" placeholder="Buscar canal...">
                        </div>
                        <div class="channel-count">
                            <span id="channelCount">0</span> canales
                        </div>
                        <div id="playlistItems" class="playlist-items">
                            <!-- Playlist items will be added here -->
                        </div>
                    </div>
                </div>

                <!-- Video Player Section -->
                <div class="col-md-9">
                    <div class="player-section">
                        <!-- URL Input -->
                        <div class="input-group mb-3 url-input-group">
                            <span class="input-group-text">
                                <i class="bi bi-link-45deg"></i>
                            </span>
                            <input type="text" id="m3uURL" class="form-control" placeholder="Ingresa la URL de tu lista M3U...">
                            <button id="loadM3U" class="btn btn-primary btn-go">
                                <i class="bi bi-play-fill"></i> Cargar
                            </button>
                        </div>

                        <!-- Video Player -->
                        <div class="video-wrapper">
                            <video id="videoPlayer" controls autoplay muted></video>
                            <div id="videoPlaceholder" class="video-placeholder">
                                <i class="bi bi-tv display-1"></i>
                                <p class="placeholder-text">Selecciona un canal para comenzar</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Billed Message -->
    <div id="billedMsg" class="billed-msg d-none"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.0/shaka-player.compiled.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
